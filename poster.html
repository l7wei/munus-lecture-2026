<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>設計作為認識世界的方法｜文創設計小組</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <script>
      if (new URLSearchParams(location.search).get("export") === "1") {
        document.documentElement.dataset.export = "true";
      }
    </script>
    <style>
      :root {
        color-scheme: dark;
        --paper: #000;
        --ink: #fff;
        --secondary: rgb(255 255 255 / 82%);
        --rule: rgb(255 255 255 / 48%);
        --sans:
          "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC",
          sans-serif;
        --width: 1080px;
        --height: 1350px;
        --margin: 72px;
        --title-size: 106px;
        --name-size: 52px;
        --chinese-name-size: 42px;
        --date-size: 50px;
        --time-size: 64px;
        --time-label-size: 32px;
        --body-size: 28px;
        --series-size: 30px;
        --action-size: 42px;
        --action-padding-y: 12px;
        --action-padding-x: 14px;
        --qr-size: 112px;
        --cursor-size: 42px;
        --cursor-offset: -6px;
        --registration-size: 32px;
        --audience-size: 24px;
        --footer-scale: 0.7;
        --organizer-size: calc(22px * var(--footer-scale));
        --organizer-name-size: calc(24px * var(--footer-scale));
        --header-top: 64px;
        --title-top: 158px;
        --title-step: 108px;
        --art-left: 458px;
        --art-top: 436px;
        --art-width: 622px;
        --art-height: 432px;
        --speaker-top: 596px;
        --credentials-gap: 22px;
        --schedule-top: 860px;
        --schedule-gap: 12px;
        --join-top: 1000px;
        --registration-gap: 8px;
        --footer-bottom: 64px;
        --footer-padding: calc(18px * var(--footer-scale));
        --college-logo-width: calc(300px * var(--footer-scale) * 0.8);
        --group-logo-size: calc(52px * var(--footer-scale));
        --brand-gap: calc(16px * var(--footer-scale));
        --footer-gap: 100px;
        --column-gap: 36px;
        --preview-gutter: 16px;
        --preview-scale: 1;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--paper);
      }
      body {
        min-height: 100svh;
        display: grid;
        place-items: center;
        color: var(--ink);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      #preview {
        position: relative;
        width: calc(var(--width) * var(--preview-scale));
        height: calc(var(--height) * var(--preview-scale));
        flex-shrink: 0;
      }
      #poster {
        position: relative;
        width: var(--width);
        height: var(--height);
        overflow: hidden;
        isolation: isolate;
        background: var(--paper);
        transform: scale(var(--preview-scale));
        transform-origin: top left;
      }
      h1,
      h2,
      p {
        margin: 0;
      }
      .inset {
        position: absolute;
        left: var(--margin);
        right: var(--margin);
      }
      .topline {
        top: var(--header-top);
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        font-size: var(--series-size);
        font-weight: 500;
      }
      h1 {
        top: var(--title-top);
        font-size: var(--title-size);
        font-weight: 900;
        letter-spacing: -0.025em;
        line-height: 1.18;
      }
      h1 span {
        display: block;
        width: max-content;
        white-space: nowrap;
      }
      h1 span + span {
        margin-left: var(--title-step);
      }
      .framework {
        position: absolute;
        left: var(--art-left);
        top: var(--art-top);
        width: var(--art-width);
        height: var(--art-height);
        overflow: hidden;
        color: var(--ink);
      }
      .speaker {
        top: var(--speaker-top);
      }
      .speaker h2 {
        font-weight: 500;
        line-height: 1.28;
      }
      .speaker h2 span {
        display: block;
        width: max-content;
      }
      .speaker-en {
        font-size: var(--name-size);
        letter-spacing: -0.035em;
      }
      .speaker-zh {
        font-size: var(--chinese-name-size);
      }
      .credentials {
        margin-top: var(--credentials-gap);
        font-size: var(--body-size);
        line-height: 1.6;
        color: var(--secondary);
      }
      .schedule {
        top: var(--schedule-top);
        border-top: 1px solid var(--rule);
        padding-top: 22px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        column-gap: var(--column-gap);
        row-gap: var(--schedule-gap);
        align-items: baseline;
      }
      .date {
        font-size: var(--date-size);
        font-weight: 500;
        letter-spacing: -0.035em;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .time {
        display: flex;
        align-items: baseline;
        gap: 18px;
      }
      .time strong {
        font-size: var(--time-size);
        font-weight: 500;
        line-height: 1.3;
        font-variant-numeric: tabular-nums;
      }
      .time span {
        font-size: var(--time-label-size);
      }
      .join {
        top: var(--join-top);
        font-size: var(--body-size);
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--column-gap);
      }
      .audience,
      .registration {
        display: grid;
        align-content: start;
        gap: var(--registration-gap);
        line-height: 1.5;
      }
      .audience p:last-child {
        color: var(--secondary);
      }
      .audience {
        font-size: var(--audience-size);
      }
      .audience .duration {
        font-size: var(--body-size);
        color: var(--secondary);
        white-space: nowrap;
      }
      .registration {
        font-size: var(--registration-size);
      }
      .registration strong {
        font-size: var(--action-size);
        font-weight: 700;
        white-space: nowrap;
      }
      .registration-action {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: var(--action-padding-y) var(--action-padding-x);
        background: var(--ink);
        color: var(--paper);
        line-height: 1.25;
        text-decoration: none;
      }
      .registration-action:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 5px;
      }
      .action-copy {
        display: grid;
        gap: 3px;
      }
      .registration-url {
        font-size: 22px;
        white-space: nowrap;
      }
      .registration-qr {
        display: block;
        width: var(--qr-size);
        height: var(--qr-size);
        flex: none;
        shape-rendering: crispEdges;
      }
      .click-cursor {
        position: absolute;
        right: calc(var(--qr-size) + 14px);
        bottom: var(--cursor-offset);
        width: var(--cursor-size);
        height: var(--cursor-size);
        overflow: visible;
        pointer-events: none;
      }
      .cursor-outline {
        fill: var(--paper);
        stroke: var(--ink);
        stroke-width: 2.5;
        stroke-linejoin: round;
      }
      .click-rays {
        fill: none;
        stroke: var(--paper);
        stroke-width: 2.5;
        stroke-linecap: square;
      }
      .organizer {
        bottom: var(--footer-bottom);
        border-top: 1px solid var(--rule);
        padding-top: var(--footer-padding);
        display: flex;
        justify-content: center;
        align-items: center;
        gap: var(--footer-gap);
        font-size: var(--organizer-size);
        line-height: 1.5;
      }
      .college-logo {
        display: block;
        width: var(--college-logo-width);
        height: auto;
      }
      .design-group {
        display: flex;
        align-items: center;
        gap: var(--brand-gap);
      }
      .group-mark {
        display: block;
        width: var(--group-logo-size);
        height: var(--group-logo-size);
        flex: none;
      }
      .group-name {
        font-size: var(--organizer-name-size);
        font-weight: 500;
      }
      .group-context {
        color: var(--secondary);
        white-space: nowrap;
      }
      html[data-export="true"] body {
        display: block;
        min-height: 0;
      }
      html[data-export="true"] #preview {
        width: var(--width);
        height: var(--height);
      }
      html[data-export="true"] #poster {
        transform: none;
      }
      @media print {
        @page {
          size: 1080px 1350px;
          margin: 0;
        }
        body {
          display: block;
        }
        #preview {
          width: var(--width);
          height: var(--height);
        }
        #poster {
          transform: none;
          print-color-adjust: exact;
        }
      }
    </style>
  </head>

    <script>
      // One ruled surface: straight leaves bend around a shared opening.
      const geometry = {
        count: 25,
        start: [70, 24],
        startStep: [8.5, 3.1],
        fold: [120, 162],
        foldStep: [8.2, 2.15],
        controls: [
          [180, 350],
          [400, 390],
        ],
        controlSteps: [
          [4.2, 1.4],
          [4.5, -3.6],
        ],
        end: [520, 60],
        endStep: [5.8, 8.4],
      };
      const point = (base, step, index) =>
        base.map((value, axis) => +(value + step[axis] * index).toFixed(2));
      const group = document.getElementById("surface-lines");
      for (let index = 0; index < geometry.count; index++) {
        const path = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "path",
        );
        const start = point(geometry.start, geometry.startStep, index);
        const fold = point(geometry.fold, geometry.foldStep, index);
        const c1 = point(geometry.controls[0], geometry.controlSteps[0], index);
        const c2 = point(geometry.controls[1], geometry.controlSteps[1], index);
        const end = point(geometry.end, geometry.endStep, index);
        path.setAttribute("d", `M${start} L${fold} C${c1} ${c2} ${end}`);
        group.append(path);
      }
      document.getElementById("poster").dataset.artReady = "true";

      function fitPreview() {
        if (document.documentElement.dataset.export === "true") return;
        const style = getComputedStyle(document.documentElement);
        const width = parseFloat(style.getPropertyValue("--width"));
        const height = parseFloat(style.getPropertyValue("--height"));
        const gutter = parseFloat(style.getPropertyValue("--preview-gutter"));
        const scale = Math.max(
          0.01,
          Math.min(
            (innerWidth - gutter * 2) / width,
            (innerHeight - gutter * 2) / height,
            1,
          ),
        );
        document.documentElement.style.setProperty("--preview-scale", scale);
      }
      fitPreview();
      addEventListener("resize", fitPreview);
    </script>
